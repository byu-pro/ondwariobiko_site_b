<svg xmlns="http://www.w3.org/2000/svg" width="400" viewBox="0 0 300 150" height="200" preserveAspectRatio="xMidYMid meet" version="1.0">
  <style>
    .snake {
      fill: none;
      stroke: #ccff00;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .snake-1 {
      stroke-dasharray: 180 110;
      animation: slither1 5s linear infinite;
    }
    .snake-2 {
      stroke-dasharray: 140 100;
      animation: slither2 4.5s linear infinite;
    }
    .snake-3 {
      stroke-dasharray: 200 130;
      animation: slither1 6.5s linear infinite;
    }
    .snake-4 {
      stroke-dasharray: 150 90;
      animation: slither2 5.5s linear infinite;
    }
    @keyframes slither1 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -580; }
    }
    @keyframes slither2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 480; }
    }
  </style>
  <rect x="-30" y="-15" width="360" height="180" fill="#000000" fill-opacity="1"/>
  <g class="snake-group">
    <path class="snake snake-1" d="M -80 75 C -20 10, 50 140, 110 75 S 220 10, 280 75 S 350 140, 400 75" />
    <path class="snake snake-2" d="M -40 20 C 30 130, 100 -20, 170 100 S 260 0, 340 120" />
    <path class="snake snake-3" d="M -60 130 C 20 0, 90 160, 150 50 S 230 160, 320 20" />
    <path class="snake snake-4" d="M -50 40 C 40 160, 120 10, 200 140 S 290 10, 360 130" />
  </g>
</svg>