  <style>
    @keyframes organicFlow1 {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      25% { transform: translate(-14px, 8px) rotate(6deg) scale(1.04); }
      50% { transform: translate(10px, -12px) rotate(-4deg) scale(0.96); }
      75% { transform: translate(-8px, 14px) rotate(8deg) scale(1.02); }
      100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
    }
    @keyframes organicFlow2 {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      25% { transform: translate(16px, -10px) rotate(-8deg) scale(0.97); }
      50% { transform: translate(-12px, 14px) rotate(6deg) scale(1.05); }
      75% { transform: translate(12px, -8px) rotate(-5deg) scale(0.99); }
      100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
    }
    @keyframes organicFlow3 {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      33% { transform: translate(-15px, -15px) rotate(10deg) scale(1.07); }
      66% { transform: translate(12px, 12px) rotate(-8deg) scale(0.94); }
      100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
    }
    @keyframes organicFlow4 {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      33% { transform: translate(15px, 15px) rotate(-12deg) scale(0.93); }
      66% { transform: translate(-12px, -10px) rotate(9deg) scale(1.06); }
      100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
    }

    .organic-shape-1 {
      transform-origin: 240px 120px;
      animation: organicFlow1 9s ease-in-out infinite;
    }
    .organic-shape-2 {
      transform-origin: 100px 75px;
      animation: organicFlow2 11s ease-in-out infinite;
    }
    .organic-shape-3 {
      transform-origin: 50px 140px;
      animation: organicFlow3 8.5s ease-in-out infinite;
    }
    .organic-shape-4 {
      transform-origin: 220px 30px;
      animation: organicFlow4 10s ease-in-out infinite;
    }
  </style>
